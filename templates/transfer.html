{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">INVENTARIO</p><h1>Traspaso entre ubicaciones</h1></div></div><form class="panel narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Producto<select name="product_id">{% for x in products %}<option value="{{ x.id }}">{{ x.sku }} · {{ x.name }}</option>{% endfor %}</select></label><div class="form-row"><label>Origen<select name="source"><optgroup label="Almacenes">{% for x in warehouses %}<option value="warehouse:{{ x.id }}">{{ x.name }}</option>{% endfor %}</optgroup><optgroup label="Tiendas">{% for x in stores %}<option value="store:{{ x.id }}">{{ x.name }}</option>{% endfor %}</optgroup></select></label><label>Destino<select name="target"><optgroup label="Tiendas">{% for x in stores %}<option value="store:{{ x.id }}">{{ x.name }}</option>{% endfor %}</optgroup><optgroup label="Almacenes">{% for x in warehouses %}<option value="warehouse:{{ x.id }}">{{ x.name }}</option>{% endfor %}</optgroup></select></label></div><label>Cantidad<input name="quantity" type="number" min="1" required></label><button>Confirmar traspaso</button></form>{% endblock %}
