{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">INVENTARIO</p><h1>Traspaso entre ubicaciones</h1></div></div><form class="panel narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Producto<select name="product_id">{% for x in products %}<option value="{{ x.id }}">{{ x.sku }} · {{ x.name }}</option>{% endfor %}</select></label><div class="form-row"><label>Origen tipo<select name="source_type"><option value="warehouse">Almacén</option><option value="store">Tienda</option></select></label><label>Origen<select name="source_id">{% for x in warehouses %}<option value="{{ x.id }}">{{ x.name }}</option>{% endfor %}{% for x in stores %}<option value="{{ x.id }}">{{ x.name }}</option>{% endfor %}</select></label></div><div class="form-row"><label>Destino tipo<select name="target_type"><option value="store">Tienda</option><option value="warehouse">Almacén</option></select></label><label>Destino<select name="target_id">{% for x in stores %}<option value="{{ x.id }}">{{ x.name }}</option>{% endfor %}{% for x in warehouses %}<option value="{{ x.id }}">{{ x.name }}</option>{% endfor %}</select></label></div><label>Cantidad<input name="quantity" type="number" min="1" required></label><button>Confirmar traspaso</button></form>{% endblock %}
