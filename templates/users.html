{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Usuarios y asignaciones</h1></div></div><form class="panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><label>Usuario<input name="username" required></label><label>Contraseña<input name="password" type="password" required></label><label>Rol<select name="role">{% for r in constants.VALID_ROLES %}<option value="{{ r }}">{{ constants.ROLE_DISPLAY_NAMES.get(r, r) }}</option>{% endfor %}</select></label></div><div class="form-row"><label>Tiendas asignadas<select name="store_ids" multiple>{% for x in stores %}<option value="{{ x.id }}">{{ x.name }}</option>{% endfor %}</select></label><label>Almacenes asignados<select name="warehouse_ids" multiple>{% for x in warehouses %}<option value="{{ x.id }}">{{ x.name }}</option>{% endfor %}</select></label></div><button>Crear usuario</button></form><section class="panel"><h2>Usuarios actuales</h2><table><tr><th>Usuario</th><th>Rol</th><th>Estado</th></tr>{% for x in users %}<tr><td>{{ x.username }}</td><td>{{ constants.ROLE_DISPLAY_NAMES.get(x.role, x.role) }}</td><td>{{ 'Activo' if x.active else 'Inactivo' }}</td></tr>{% endfor %}</table></section>{% endblock %}
